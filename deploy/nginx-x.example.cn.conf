# /etc/nginx/conf.d/x.example.cn.conf
#
# LLM Proxy Gateway 反向代理（仅 HTTPS）
#
# 前提：应用监听 127.0.0.1:4936，并以 uvicorn 默认的 proxy_headers 启动。
#       nginx 与本服务同机部署（不同机需调整 forwarded-allow-ips，见文末）。

upstream llm_proxy {
    server 127.0.0.1:4936;
    keepalive 32;
}

# ── HTTP：只做跳转，不承载业务 ────────────────────────────────
server {
    listen      80;
    listen [::]:80;
    server_name x.example.cn;

    # 若希望 80 端口直接断连而不是跳转，改为：return 444;
    # return 301 https://$host$request_uri;
    return 444;
}

# ── HTTPS ────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx < 1.25.1 请改为：listen 443 ssl http2;

    server_name x.example.cn;

    # ── 证书（按实际路径替换；certbot 一般在 /etc/letsencrypt/live/x.example.cn/）──
    ssl_certificate     /etc/nginx/ssl/x.example.cn.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/x.example.cn.key;

    # 仅 TLS 1.2 / 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/x.example.cn.fullchain.pem;
    resolver 223.5.5.5 119.29.29.29 valid=300s;
    resolver_timeout 5s;

    # ── 安全响应头 ────────────────────────────────────────────
    # 注意：HSTS 一旦下发，浏览器会强制 https 一年，证书异常时很难回退。
    # 建议先用 max-age=300 验证，确认稳定后再调到 31536000。
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    server_tokens off;

    # 只接受 API 需要的方法（HEAD 必须保留：curl -I、监控探活、部分负载均衡都用它）
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
        return 405;
    }

    # ── 请求体 ────────────────────────────────────────────────
    # 必须 ≥ 应用的 limits.max_body_mb（默认 32MB），并留余量。
    # 若这里小于应用值，超限请求会先被 nginx 用 HTML 错误页挡掉，
    # 下游拿到的是 nginx 的 413，而不是应用返回的 JSON 错误。
    client_max_body_size 40m;
    client_body_timeout  60s;

    # ── 反向代理 ──────────────────────────────────────────────
    location / {
        proxy_pass http://llm_proxy;
        proxy_http_version 1.1;

        # 【必须】转发真实来源 IP。
        # 应用靠 request.client.host 区分本地/远程：本机回环免 key，其余必须带 key。
        # 少了这几行，所有请求都会被 uvicorn 视为来自 127.0.0.1 → 鉴权整体失效。
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Host              $host;

        # 清空 Connection 才能复用 upstream keepalive
        proxy_set_header Connection "";

        # 【必须】关闭响应缓冲，否则 SSE 会被攒着一次性吐出，
        # 流式输出退化成"等半天然后刷一大段"。
        proxy_buffering off;
        proxy_cache     off;
        gzip            off;

        # 请求体直传，不在 nginx 落盘（大 prompt / 图片场景更快）
        proxy_request_buffering off;

        # 超时必须大于应用侧的上游读超时（600s），否则长回答会被 nginx 先掐断
        proxy_connect_timeout 15s;
        proxy_send_timeout    620s;
        proxy_read_timeout    620s;

        # 让上游的 4xx/5xx 原样返回，不要替换成 nginx 错误页
        proxy_intercept_errors off;
    }

    # 健康检查（不写 access_log，避免探活刷日志）
    location = /health {
        proxy_pass http://llm_proxy;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host            $host;
        access_log off;
    }

    # ── 可选：nginx 层限流（应用层已有，这里是更早的拦截）─────────
    # 先在 http 块定义：
    #   limit_req_zone $binary_remote_addr zone=llm_api:10m rate=120r/m;
    # 再在 location / 内启用：
    #   limit_req zone=llm_api burst=40 nodelay;
    #   limit_req_status 429;

    # ── 可选：只暴露 API 路径，其余返回 404 ──────────────────────
    # location / {
    #     ...
    # }
    # location ~ ^/v1/(messages|chat/completions|responses|models)$ { ... }
}

# ── 访问日志（放在 http 块或此文件顶部之外）────────────────────
# log_format llm '$remote_addr - $remote_user [$time_local] "$request" '
#                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
#                 'xff=$http_x_forwarded_for rt=$request_time';
# access_log /var/log/nginx/x.example.cn.access.log llm;

# ── 若 nginx 与本服务不在同一台机器 ───────────────────────────
# uvicorn 默认只信任来自 127.0.0.1 的 X-Forwarded-For，
# 跨机部署需显式放开到 nginx 的地址，否则所有请求都被判为同一来源：
#   uvicorn app.main:app --host 127.0.0.1 --port 4936 \
#       --proxy-headers --forwarded-allow-ips=<nginx 的 IP>
